name: Update YouTube Videos and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run YouTube update script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node update-youtube.js
      
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html portfolio-data.js workshop/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update YouTube videos [automated]"
          git push
      
      # 差分デプロイ。サーバー上の .ftp-deploy-sync-state.json と比較し、
      # 変更のあったファイルだけを転送する（初回のみ全ファイル転送）。
      - name: Deploy to Xserver via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /enactworks.com/public_html/
          local-dir: ./
          # 公開不要なソース・設定ファイルは転送しない
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.claude/**
            update-youtube.js
            package.json
            package-lock.json
            README.md
